name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: vet
        run: go vet ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: docker compose config --quiet
      - name: build, call, and check
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose --profile client build server client
          docker compose up -d server
          cid="$(docker compose ps -q server)"
          if [ -z "$cid" ]; then
            echo "server container id is empty"
            docker compose logs
            exit 1
          fi
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" || true)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "server became unhealthy"
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "server did not become healthy (status=${status})"
            docker compose logs
            exit 1
          fi
          docker compose --profile client run --rm -T client > client-out.json
          python3 scripts/check_results.py testdata/input.json testdata/expected.json client-out.json
