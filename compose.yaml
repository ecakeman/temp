name: banner

services:
  server:
    build:
      context: .
      target: server
    image: banner-server:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RULES_PATH: /rules/rules.json
      ADDR: ":8080"
    volumes:
      - ./rules/rules.json:/rules/rules.json:ro
    networks:
      - banner
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/server", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  client:
    profiles: ["client"]
    build:
      context: .
      target: client
    image: banner-client:local
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: http://server:8080
    command: ["-file", "/data/input.json", "-server", "http://server:8080"]
    volumes:
      - ./testdata/input.json:/data/input.json:ro
    networks:
      - banner
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64

networks:
  banner:
    driver: bridge
    name: banner_net
